name: lucco
description: LUCCO Online Fashion Store
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5+1

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.4.3
  firebase_messaging: ^16.0.0

  # UI
  google_fonts: ^6.3.1
  carousel_slider: ^5.1.2
  smooth_page_indicator: ^1.2.1
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.2.3
  imageview360: ^1.3.0

  # Icons
  font_awesome_flutter: ^10.12.0

  # Utilities
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/products/luxury_dress.jpg
    - assets/images/products/leather_jacket.jpg
    - assets/images/products/classic_shoes.jpg
    - assets/images/products/luxury_handbag.jpg